name: Deploy to IBM Code Engine

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "app=rcs-backend" >> $GITHUB_OUTPUT
          else
            echo "tag=test" >> $GITHUB_OUTPUT
            echo "app=rcs-backend-test" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: hyunabae/rcs-backend:${{ steps.target.outputs.tag }}
          build-args: |
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f

      - name: Deploy to Code Engine
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        run: |
          ibmcloud login --apikey "$IBM_CLOUD_API_KEY" -r ca-tor
          ibmcloud target -g 5699a8fd088d481fac03f8960307ed4a
          ibmcloud ce project select --name ce-6960005bxt
          ibmcloud ce app update --name ${{ steps.target.outputs.app }} --image hyunabae/rcs-backend:${{ steps.target.outputs.tag }}

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "app=rcs-frontend" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.VITE_API_BASE_URL }}" >> $GITHUB_OUTPUT
          else
            echo "tag=test" >> $GITHUB_OUTPUT
            echo "app=rcs-frontend-test" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.VITE_API_BASE_URL_TEST }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: hyunabae/rcs-frontend:${{ steps.target.outputs.tag }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.target.outputs.api_url }}
            VITE_DATA_SOURCE=api

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install code-engine -f

      - name: Deploy to Code Engine
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        run: |
          ibmcloud login --apikey "$IBM_CLOUD_API_KEY" -r ca-tor
          ibmcloud target -g 5699a8fd088d481fac03f8960307ed4a
          ibmcloud ce project select --name ce-6960005bxt
          ibmcloud ce app update --name ${{ steps.target.outputs.app }} --image hyunabae/rcs-frontend:${{ steps.target.outputs.tag }}
